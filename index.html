<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praja Seva – Andhra Pradesh Civic Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#0a1c30;--mut:#5b6b7c;--line:#e4dccb;--hdr:#0e2a47;--teal:#0d8276;--red:#c62828;--amb:#b26a00;--grn:#1b7f3b;--soft:#efe9da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1522;--card:#13233a;--ink:#e8eef6;--mut:#9fb0c4;--line:#243a57;--hdr:#071120;--teal:#2bb5a5;--red:#ff7b7b;--amb:#ffb454;--grn:#4cd07d;--soft:#1c3050}}
:root[data-theme="dark"]{--bg:#0b1522;--card:#13233a;--ink:#e8eef6;--mut:#9fb0c4;--line:#243a57;--hdr:#071120;--teal:#2bb5a5;--red:#ff7b7b;--amb:#ffb454;--grn:#4cd07d;--soft:#1c3050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans","Noto Sans Telugu",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#f7f1e3;z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#f7f1e3;color:#0e2a47;padding:10px 14px;border-bottom:1px solid #0e2a471f}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg{width:52px;height:52px;border-radius:50%;background:#fff}
.brand{line-height:1.15;font-family:Georgia,serif}.brand .bn{font-size:20px;font-weight:700;letter-spacing:.5px}.brand b{font-family:"Noto Sans Telugu",serif}.brand small{display:block;font-size:11px}
.tg{flex:1;font-size:11px;line-height:1.4;border-left:1px solid #0e2a4133;padding-left:10px;min-width:160px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header .pill{width:auto;background:#fff;color:#0e2a47;border:1px solid #0e2a4133;border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px}
header .pill.navy{background:#0e4a7a;color:#fff;border-color:#0e4a7a}
.usr{width:38px;height:38px;border-radius:50%;background:#0e2a47;color:#fff;border:0}
.sos{background:var(--red);color:#fff;border:0;border-radius:20px;padding:7px 12px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav button{flex:none;background:transparent;color:#0e2a47;border:0;border-radius:20px;padding:6px 14px}
nav button.on{background:#0e2a47;color:#fff;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:14px}
#hi{margin:0 0 10px;font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kp b{display:block;font-size:24px;color:var(--teal)}
.kp span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card img,.pv img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin:6px 0}
.card h2,h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:16px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px;margin:2px 0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);font-weight:600}
.s-pend{color:var(--amb)}.s-prog{color:var(--teal)}.s-done{color:var(--grn)}
.v-crit,.od{color:var(--red)}.v-high{color:var(--amb)}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
button{font:inherit;cursor:pointer}
.b1{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.b2{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px;margin:6px 0}
.tile{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px}
.tile.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
.bar{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.bar i{height:10px;border-radius:5px;background:linear-gradient(var(--teal),var(--teal)) 0/var(--w) 100% no-repeat,var(--soft)}
svg text{fill:var(--ink);font-size:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0e2a47;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%}
#toast.show{opacity:1}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
#ov.show{display:flex}
#ov .card{max-width:380px;width:100%}
#ov a{color:var(--teal);font-weight:700;font-size:18px}
.hero{width:100%;display:block;border-radius:18px;border:1px solid var(--line)}
.hc{border:0;border-radius:18px;padding:18px 10px;color:#0a1c30;font-weight:700;font-size:15px;text-align:center}
.hc i{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:#ffffffaa;font-style:normal;font-size:28px}
@media(max-width:860px){.tg{display:none}}

/* ===== 3D depth + professional polish ===== */
:root{--edge:#0a5f56;--ease:cubic-bezier(.2,.8,.2,1);--sh:0 1px 2px rgba(10,28,48,.08),0 8px 16px -6px rgba(10,28,48,.16),0 22px 34px -16px rgba(10,28,48,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:#14786d;--sh:0 1px 2px #0006,0 10px 18px -6px #0008,0 24px 36px -16px #000a}}
:root[data-theme="dark"]{--edge:#14786d;--sh:0 1px 2px #0006,0 10px 18px -6px #0008,0 24px 36px -16px #000a}
body{background:radial-gradient(900px 380px at 50% -80px,color-mix(in srgb,var(--teal) 14%,transparent),transparent 70%) no-repeat,var(--bg)}
header{box-shadow:0 10px 22px -12px rgba(14,42,71,.45)}
.lg{box-shadow:0 3px 0 #0e2a4122,0 8px 14px -4px #0e2a4155}
.card,.kp{border-radius:14px;box-shadow:var(--sh);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.kp{border-bottom:3px solid var(--teal)}
.tag{box-shadow:inset 0 -1px 0 #0000001a}
.bar i{box-shadow:inset 0 1px 2px #0003}
select,input,textarea{border-radius:10px;box-shadow:inset 0 2px 3px #0e2a4112;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:inset 0 2px 3px #0e2a4112,0 0 0 3px color-mix(in srgb,var(--teal) 28%,transparent)}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 60%,#fff);outline-offset:2px}
/* raised, pressable buttons */
.b1,.b2,.sos,.usr,.tile,.pill,nav button{transform:translateY(calc(var(--h,0px)*-1));transition:transform .16s var(--ease),box-shadow .16s var(--ease),filter .16s,background .2s;-webkit-tap-highlight-color:transparent}
.b1,.b2,.sos,.usr,.tile,header .pill,nav button.on{--d:calc(var(--b,4px) + var(--h,0px));box-shadow:0 var(--d) 0 var(--e),0 calc(var(--d)*3) 14px -8px var(--g)}
.b1{--e:var(--edge);--g:var(--teal);background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 82%,#fff),var(--teal));border-radius:10px;padding:10px 20px}
.b2{--b:3px;--e:var(--line);--g:#0e2a47;border-radius:10px;padding:7px 12px}
header .pill{--b:3px;--e:#0e2a4128;--g:#0e2a47}
header .pill.navy{--e:#082640;--g:#0e4a7a}
.usr{--e:#061a30;--g:#0e2a47}
.sos{--e:#8e1b1b;--g:var(--red);position:relative}
.sos::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--red);opacity:0;animation:ring 2.6s ease-out infinite;pointer-events:none}
.tile{--b:3px;--e:var(--line);--g:#0a1c30;border-radius:12px}
.tile.on{--h:-2px;--e:var(--teal);box-shadow:0 0 0 2px var(--teal),0 var(--d) 0 var(--e)}
nav{padding:6px 3px 10px}
nav button.on{--b:3px;--e:#061a30;--g:#0e2a47}
/* home tiles: the 3D hero buttons */
.tiles{perspective:900px}
.hc{box-shadow:0 6px 0 #0a1c302e,0 16px 24px -10px #0a1c3066;transform:perspective(700px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s var(--ease),box-shadow .18s var(--ease);animation:pop .55s var(--ease) backwards}
.hc:nth-child(2){animation-delay:.07s}.hc:nth-child(3){animation-delay:.14s}.hc:nth-child(4){animation-delay:.21s}
.hc i{box-shadow:inset 0 -3px 0 #0a1c3014,0 6px 10px -3px #0a1c3055}
.hero{border-radius:18px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;box-shadow:0 8px 0 #0e2a4114,0 28px 40px -20px #0a1c3099}
@media(hover:hover){
.b1:hover,.b2:hover,.sos:hover,.usr:hover,.tile:hover,.pill:hover,nav button:hover{--h:3px}
.b1:hover{filter:brightness(1.06)}
nav button:not(.on):hover{background:#0e2a4714}
.hc:hover{--ty:-6px;box-shadow:0 12px 0 #0a1c302e,0 26px 30px -12px #0a1c3077}
.card:not(#ovc):hover,.kp:hover{transform:translateY(-3px);box-shadow:0 2px 3px rgba(10,28,48,.1),0 16px 26px -8px rgba(10,28,48,.24),0 32px 44px -18px rgba(10,28,48,.26)}}
.b1:active,.b2:active,.sos:active,.usr:active,.tile:active,.pill:active,nav button:active{--h:-3px;filter:none}
.hc:active{--ty:4px;box-shadow:0 2px 0 #0a1c302e,0 4px 8px -4px #0a1c3066}
#ov{backdrop-filter:blur(5px)}
#ov.show .card{animation:pop .3s var(--ease)}
#toast{box-shadow:0 12px 24px -8px #0008}
@keyframes pop{from{opacity:0;transform:perspective(700px) translateY(22px) scale(.85) rotateX(-20deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35,1.6)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Indian flag theme, intro, ticker, scheme corner, voice agent ===== */
:root{--chakra:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%20fill%3D%27none%27%20stroke%3D%27%23000080%27%20opacity%3D%27.11%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20stroke-width%3D%272%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%278%27%20stroke-width%3D%272%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2727%27%20stroke-width%3D%2738%27%20stroke-dasharray%3D%27.8%206.27%27/%3E%3C/svg%3E");--teal:#138808;--edge:#0b5f06;--saf:#ff9933}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#43c75a;--edge:#1d7a2c}}
:root[data-theme="dark"]{--teal:#43c75a;--edge:#1d7a2c}
body::before{background:#ffd49a}
header{background:var(--chakra) center 34%/230px no-repeat,linear-gradient(180deg,#ffd49a 0,#ffe9cc 28%,#fff 52%,#e4f4e6 78%,#bfe5c6 100%);border-bottom:0}
header::before{content:"";display:block;height:5px;margin:-10px -14px 8px;background:linear-gradient(90deg,#ff9933 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.top{justify-content:center}.brand{text-align:left}.brand .bn{font-size:26px}
.tg{flex-basis:100%;border-left:0;padding:0;text-align:center;min-width:0}
.acts{flex-basis:100%;justify-content:center}
nav button:first-child{margin-left:auto}nav button:last-child{margin-right:auto}
nav button.on{background:#000080}
.hc{border:1px solid #0e2a4122}
main{padding-bottom:76px}
#toast{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
@media(max-width:700px){header{position:static}}
/* intro */
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:var(--chakra) center/min(90vmin,680px) no-repeat,linear-gradient(180deg,#ffd49a,#fff 48%,#bfe5c6);color:#0e2a47;transition:opacity .6s,transform .6s var(--ease);touch-action:none;overflow:hidden}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
.ih{text-align:center;line-height:1.15}.ih b{display:block;font:700 clamp(28px,6vw,46px) Georgia,serif;letter-spacing:2px}.ih span{font:700 clamp(18px,3.5vw,26px) "Noto Sans Telugu",serif}
.istage{width:min(88vw,860px);perspective:1400px;margin:8px 0}
.icard{position:relative;border-radius:16px;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;box-shadow:0 0 0 5px #ff9933,0 0 0 10px #fff,0 0 0 15px #138808,0 36px 60px -20px #0a1c30bb;animation:open 1.4s var(--ease) backwards}
.icard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.icard i{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#fff6,transparent 45%);pointer-events:none}
.isub{margin:0;font-weight:600;text-align:center}
.big{font-size:17px;padding:13px 28px;border-radius:14px}
@keyframes open{from{opacity:0;transform:rotateX(72deg) rotateY(-38deg) translateZ(-320px) scale(.7)}}
/* trending ticker */
.tick{position:fixed;inset:auto 0 0;z-index:14;display:flex;background:#0e2a47;color:#fff;font-size:13px;padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid;border-image:linear-gradient(90deg,#ff9933 33.3%,#fff 33.3% 66.6%,#138808 66.6%) 1;box-shadow:0 -8px 20px -10px #0006}
.tl{flex:none;background:#ff9933;color:#0e2a47;font-weight:800;padding:8px 12px;white-space:nowrap}
.tw{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tt{display:inline-flex;animation:tk var(--dur,60s) linear infinite;will-change:transform}
.tw:hover .tt{animation-play-state:paused}
.tt span{padding:0 24px;position:relative}.tt span::after{content:"";position:absolute;right:-3px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#43c75a}
@keyframes tk{to{transform:translateX(-50%)}}
/* new-scheme corner */
.nsch{position:fixed;right:12px;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:13;width:min(250px,64vw);padding:10px 28px 10px 12px;background:var(--card);color:var(--ink);border:2px solid #ff9933;border-radius:14px;cursor:pointer;animation:glow 2.4s ease-in-out infinite}
.nsch[hidden]{display:none}.nsch b{display:block;margin:4px 0 2px}.nsch small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.nsch .x{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--mut);font-size:20px;line-height:1}
.nb{display:inline-block;background:#ff9933;color:#0e2a47;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px}
@keyframes glow{0%,100%{box-shadow:0 8px 18px -8px #0a1c3077,0 0 0 0 #ff993300}50%{box-shadow:0 8px 18px -8px #0a1c3077,0 0 0 7px #ff993355}}
/* voice agent */
.agh{display:flex;gap:10px;align-items:center}.agh h2{margin:0}
.bot{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;font-size:28px;background:linear-gradient(135deg,#ffe0b8,#fff,#d4eed8);box-shadow:0 4px 0 #0e2a4122,0 10px 14px -6px #0e2a4166}
.chips{margin:10px 0}.chips .b2.on{--e:var(--teal);border-color:var(--teal);color:var(--teal)}
.sp{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-weight:600}.sp input[type=checkbox]{width:auto}
.agm{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin:6px 0}
.mg{max-width:90%;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}.mg p{margin:2px 0}.mg img{width:100%;max-height:160px;object-fit:cover;border-radius:8px}
.mg.u{align-self:flex-end;background:#ffe9cc;color:#0a1c30}.mg.a{align-self:flex-start}
#agmicb.rec{--e:#8e1b1b;background:var(--red);color:#fff}
.agi .row{margin-top:8px}
@media(prefers-reduced-motion:reduce){.tw{overflow-x:auto}}

/* ===== v3: header, portals, monsoon, AI, city toggle, AP background ===== */
header{position:fixed;top:0;left:0;right:0;transition:transform .5s var(--ease)}
header.away{transform:translateX(-105%)}
@media(max-width:700px){header{position:fixed}}
.top{padding-inline:50px}
header .usr{position:absolute;top:16px;right:14px;z-index:2;font-size:18px;display:grid;place-items:center;padding:0}
header .pill.lgb{background:#000080;color:#fff;border-color:#000080;--e:#00004d;--g:#000080}
.cmh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.cmh h2{margin:0}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);border-radius:16px;padding:5px 14px;font-weight:600;font-size:13px}
.seg button.on{background:#000080;color:#fff}
.cmw[data-m=map]>.card:nth-child(2){display:none}
.cmw[data-m=list]>.card:first-child{display:none}
.cmw[data-m=map],.cmw[data-m=list]{grid-template-columns:1fr}
.ub-d{animation:ubb 1s linear infinite}
.ub-r{transform-box:fill-box;transform-origin:center;animation:ubp 1.4s ease-out infinite}
@keyframes ubb{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes ubp{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.rg{margin:12px 0 6px}.rg h3{font-size:13px;margin:0 0 6px;color:var(--teal);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:4px}
.card svg text{font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-top:4px solid #ff9933;border-radius:14px;padding:14px;color:var(--ink);text-decoration:none;box-shadow:var(--sh);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.pcard:nth-child(3n+2){border-top-color:#c9c9c9}
.pcard:nth-child(3n){border-top-color:#138808}
.pcard:hover{transform:translateY(-4px)}
.pcard .pi{font-size:26px}
.pcard b{font-size:15px}
.pcard em{font-style:normal;font-size:12px;color:var(--mut);font-weight:600}
.pcard p{margin:4px 0 6px;font-size:13px;color:var(--ink);flex:1}
.pcard .go{font-weight:700;font-size:13px;color:#000080}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pcard .go{color:#9db4ff}}
:root[data-theme="dark"] .pcard .go{color:#9db4ff}
.wst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:2px 0 10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.wc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--grn);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.wc.l2{border-left-color:var(--amb)}.wc.l3{border-left-color:var(--red)}
.wh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.wt{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:0 4px 4px 0;background:#e3f4e7;color:#14532d}
.wt.l2{background:#ffe2b0;color:#4a2c00}.wt.l3{background:#c62828;color:#fff}
.wd{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.wd span{background:var(--soft);border-radius:8px;text-align:center;padding:4px 2px}
.wd small{display:block;font-size:10px;color:var(--mut)}.wd b{font-size:14px}.wd u{text-decoration:none;font-size:10px;color:var(--mut)}
.tipr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tipr div{background:var(--soft);border-radius:12px;padding:10px;font-size:13px}
.hc i svg{width:100%;height:100%;border-radius:50%}
.bot{width:64px;height:64px;padding:3px;font-size:0;background:linear-gradient(180deg,#ff9933 0 33%,#fff 33% 66%,#138808 66%);box-shadow:0 6px 12px -4px #0a1c3066}
.bot svg{width:100%;height:100%;border-radius:50%;background:#fff}
.ag{border-top:5px solid #ff9933;box-shadow:var(--sh),inset 0 -5px 0 #138808}
.ag .b1{background:linear-gradient(180deg,#2323b8,#000080);--e:#00004d;--g:#000080}
.ag .chips .b2.on{--e:#ff9933;border-color:#ff9933;color:#b35a00}
.mg.a{background:#eef8ef;border-left:4px solid #138808;color:#0a1c30}
.mg.u{border-right:4px solid #ff9933}

const shrink=f=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{const s=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function toast(m,e){const x=$("#toast");x.textContent=m;x.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("show"),3500)}

const PORTALS=[["India.gov.in","https://www.india.gov.in","National portal of India","భారత జాతీయ పోర్టల్","Single doorway to central and state government services, forms, schemes and department contacts.","కేంద్ర, రాష్ట్ర ప్రభుత్వ సేవలు, ఫారాలు, పథకాలు, శాఖల సమాచారం ఒకే చోట.","🇮🇳"],["Andhra Pradesh Government","https://www.ap.gov.in","State government portal","రాష్ట్ర ప్రభుత్వ పోర్టల్","Official site of the AP government: departments, orders, notifications and citizen services.","ఏపీ ప్రభుత్వ అధికారిక సైట్: శాఖలు, ఉత్తర్వులు, ప్రకటనలు, పౌర సేవలు.","🏛️"],["Ayushman Bharat PM-JAY","https://pmjay.gov.in","Health cover","ఆరోగ్య బీమా","Free hospital cover for eligible families. Check eligibility and find empanelled hospitals.","అర్హ కుటుంబాలకు ఉచిత ఆసుపత్రి చికిత్స. అర్హత చూడండి, ఆసుపత్రులను కనుగొనండి.","🏥"],["PM Awas Yojana (Urban)","https://pmay-urban.gov.in","Urban housing","పట్టణ గృహాలు","Housing assistance for urban families. Apply for support and track your application.","పట్టణ కుటుంబాలకు ఇంటి సహాయం. దరఖాస్తు చేయండి, స్థితిని చూడండి.","🏠"],["Swachh Bharat Mission (Urban)","https://swachhbharaturban.gov.in","Sanitation","పారిశుద్ధ్యం","Cleanliness drives, toilets and solid-waste management in cities and towns.","నగరాల్లో పరిశుభ్రత కార్యక్రమాలు, మరుగుదొడ్లు, చెత్త నిర్వహణ.","🧹"],["Jal Jeevan Mission","https://jaljeevanmission.gov.in","Tap water","కుళాయి నీరు","Tap water connection for every rural household. See village-wise progress.","ప్రతి గ్రామీణ ఇంటికి కుళాయి నీరు. గ్రామాల వారీ పురోగతి చూడండి.","🚰"]];
const TRK=()=>`<div class="card"><h2>🔎 ${t("trk")}</h2><div class="row"><input id="tk" placeholder="${t("trkp")}" style="flex:1"><button class="b1" onclick="trk()">${t("go")}</button></div><div id="tr"></div></div>`;
const VIEWS={
home:()=>`<img class="hero" src="${HERO}" alt="Praja Seva"><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0">${[["ai",AVA,"#ffe3c2",t("aiT")],["report","📍","#ffe0b8",t("report")],["feed","🔍","#ffffff",t("trk")],["schemes","🏛️","#d4eed8",t("sc")]].map(a=>`<button class="hc" style="background:${a[2]}" onclick="go('${a[0]}')"><i>${a[1]}</i>${a[3]}</button>`).join("")}</div>${TRK()}${cityBlock()}`,
feed:()=>TRK()+`<div class="flt"><input placeholder="${t("search")}" value="${esc(F.q)}" oninput="F.q=this.value;list()">${sel("city",F.city,[["",t("allc")],...Object.keys(CITIES).map(k=>[k,cn(k)])])}${sel("st",F.st,[["",t("alls")],["pend",t("pend")],["prog",t("prog")],["done",t("done")]])}${sel("k",F.k,[["",t("allk")],...Object.keys(CATS).map(k=>[k,CATS[k][0]+" "+kn(k)])])}${sel("s",F.s,[["p",t("sp")],["n",t("sn")]])}</div><div class="grid" id="list"></div>`,
report:()=>`<div class="card"><h2>${t("report")}</h2><label>${t("cat")}</label><div class="tiles">${Object.keys(CATS).map(k=>`<button type="button" class="tile${R.cat===k?" on":""}" data-k="${k}" onclick="pick('${k}')">${CATS[k][0]}<br>${kn(k)}</button>`).join("")}</div><p class="mut" id="dp"></p><label>${t("ttl")}</label><input id="ti" oninput="sug()"><label>${t("desc")}</label><textarea id="de" rows="3" oninput="sug()"></textarea><div class="two"><div><label>${t("city")}</label><select id="ci">${Object.keys(CITIES).map(k=>`<option value="${k}"${k===S.u.c?" selected":""}>${cn(k)}</option>`).join("")}</select></div><div><label>${t("area")}</label><input id="ar"></div></div><div class="row" style="margin-top:8px"><button class="b2" onclick="gps()">📍 ${t("loc")}</button></div><div class="two"><div><label>${t("sev")}</label><select id="sv">${Object.keys(SEV).map(k=>`<option value="${k}"${k==="med"?" selected":""}>${SEV[k][lg()]}</option>`).join("")}</select></div><div><label>${t("photo")}</label><input type="file" accept="image/*" onchange="ph(event)"></div></div><div class="pv" id="pv">${R.img?`<img src="${R.img}" alt="">`:""}</div><p class="mut">${t("note")}</p><button class="b1" onclick="submit()">${t("sub")}</button></div>`,
map:()=>{const MP=MAPPX,LL=["AMR","GNT"];
const dots=Object.keys(CITIES).map(k=>{const cs=S.d.filter(c=>c.city===k);if(!cs.length)return"";const ac=cs.filter(c=>c.st!=="done"),[x,y]=MP[k]||[-99,-99],col=ac.some(c=>c.sev==="crit")?"var(--red)":ac.some(over)?"var(--amb)":ac.length?"var(--teal)":"var(--grn)";return `<g onclick="F.city='${k}';go('feed')" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${7+Math.min(9,cs.length*2)}" fill="${col}" fill-opacity=".85" stroke="#fff" stroke-width="1.5"/><text x="${x+(LL.includes(k)?-12:12)}" y="${y+4}"${LL.includes(k)?' text-anchor="end"':""}>${cn(k)} (${cs.length})</text></g>`}).join("");
const tc=Object.keys(CITIES).map(k=>[cn(k),S.d.filter(c=>c.city===k&&c.st!=="done").length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
return `<div class="two"><div class="card"><div class="apm"><img src="${MAPIMG}" alt="Andhra Pradesh district map"><svg viewBox="0 0 590 588">${dots}${uB()}</svg></div><p class="mut">🔴 ${t("crit")} · 🟠 ${t("over")} · 🟢 ${t("done")}<br>${t("sch")}<br><span class="apcr">Map: paintmaps.com</span></p></div><div class="card"><h2>${t("topc")}</h2>${RG.map(g=>{const rows=g[2].map(k=>[cn(k),S.d.filter(c=>c.city===k&&c.st!=="done").length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);if(!rows.length)return"";const mx=rows[0][1];return `<div class="rg"><h3>${g[lg()]}</h3>${rows.map(a=>bar(a,mx)).join("")}</div>`}).join("")}</div></div>`},
disp:()=>{const r=S.u.r;if(r==="citizen")return `<div class="card">🔒 ${t("lock")}</div>`;const as=["officer","comm","coll"].includes(r),col=(st,ttl)=>{const a=S.d.filter(c=>c.st===st).sort((x,y)=>pr(y)-pr(x));return `<section><h2>${ttl} · ${a.length}</h2>${a.map(c=>dcard(c,as)).join("")}</section>`};return `<div class="two">${col("pend",t("unas"))}${col("prog",t("work"))}${col("done",t("fixed"))}</div>`},
stats:()=>{const cs=S.d,n=cs.length||1,bk=Object.keys(CATS).map(k=>[CATS[k][0]+" "+kn(k),cs.filter(c=>c.c===k).length]),bc=Object.keys(CITIES).map(k=>[cn(k),cs.filter(c=>c.city===k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);return `<div class="kpi"><div class="kp"><b>${Math.round(cs.filter(c=>c.st==="done").length/n*100)}%</b><span>${t("resr")}</span></div><div class="kp"><b>${Math.round((n-cs.filter(over).length)/n*100)}%</b><span>${t("ontime")}</span></div><div class="kp"><b>${Math.round(cs.reduce((a,c)=>a+c.v,0)/n)}</b><span>${t("avg")}</span></div></div><div class="two"><div class="card"><h2>${t("bycat")}</h2>${bk.map(a=>bar(a,Math.max(1,...bk.map(x=>x[1])))).join("")}</div><div class="card"><h2>${t("bycity")}</h2>${bc.map(a=>bar(a,bc[0][1])).join("")}</div></div>`},
info:()=>{const hz=["flood","drain","manhole","tree"],rows=Object.keys(CITIES).map(k=>[cn(k),S.d.filter(c=>c.city===k&&c.st!=="done"&&hz.includes(c.c)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);return `<div class="two"><div class="card"><h2>🌧️ ${t("fs")}</h2><p class="mut">${t("fsd")}</p>${rows.map(a=>bar(a,rows[0][1])).join("")||"<p>✅</p>"}<ul>${TIPS.map(x=>`<li>${x[lg()]}</li>`).join("")}</ul></div><div class="card"><h2>📋 ${t("sc")}</h2><p class="mut">${t("scd")}</p>${SCH.map(s=>`<p><b>${s[0]}</b><br><span class="mut">${s[1+lg()]}</span></p>`).join("")}</div></div>`}};
const part=i=>()=>{const d=document.createElement("div");d.innerHTML=VIEWS.info();return d.children[0].children[i].outerHTML};
Object.assign(VIEWS,{monsoon:part(0),schemes:()=>`<div class="card"><h2>📋 ${t("sc")}</h2><p class="mut">${t("scd")}</p></div><div class="pgrid">${SCH.map(s=>`<div class="pcard"><span class="pi">🏛️</span><b>${s[0]}</b><p>${s[1+lg()]}</p></div>`).join("")}</div>`,
ai:()=>`<div class="card"><h2>🤖 Praja AI</h2><p class="mut">${t("aid")}</p><textarea id="aq" rows="3" placeholder="${t("aph")}"></textarea><button class="b1" style="margin-top:8px" onclick="ask()">${t("ask")}</button><div id="ai2"></div></div>`,
portals:()=>`<div class="card"><h2>🏛️ ${t("pt")}</h2><p class="mut">${t("ptd")}</p></div><div class="pgrid">${PORTALS.map(p=>`<a class="pcard" href="${p[1]}" target="_blank" rel="noopener"><span class="pi">${p[6]}</span><b>${p[0]}</b><em>${p[2+lg()]}</em><p>${p[4+lg()]}</p><span class="go">${lg()?"తెరవండి":"Open"} ↗</span></a>`).join("")}</div>`,
champ:()=>{const tr=p=>p>=200?"Praja Champion":p>=100?"Ward Rakshak":"Nagarika Sevak",rows=[["Lakshmi P.",320],["Ravi K.",210],["Sita D.",140],[S.u.n||t("you"),S.u.p]].sort((a,b)=>b[1]-a[1]);return `<div class="card"><h2>🏅 ${t("champ")}</h2><p class="mut">${t("chd")}</p>${rows.map((r,i)=>`<div class="bar" style="grid-template-columns:28px 1fr 50px"><b>${i+1}</b><span>${esc(r[0])} · ${tr(r[1])}</span><b>${r[1]}</b></div>`).join("")}</div>`},
admin:()=>S.u.r==="citizen"?VIEWS.disp():VIEWS.stats()+VIEWS.disp()});
function ask(){const s=$("#aq").value;let k=null;for(const x of ORD)if(CATS[x][5].test(s)){k=x;break}$("#ai2").innerHTML=k?`<p>${CATS[k][0]} <b>${kn(k)}</b> · 🏢 ${CATS[k][4]} · SLA ${CATS[k][3]}h</p><button class="b1" onclick="R.cat='${k}';go('report')">${t("report")}</button>`:`<p class="mut">${t("noai")}</p>`}
function list(){const q=F.q.toLowerCase(),a=S.d.filter(c=>(!F.city||c.city===F.city)&&(!F.st||c.st===F.st)&&(!F.k||c.c===F.k)&&(!q||(c.t+c.a+c.id+cn(c.city)).toLowerCase().includes(q)));a.sort((x,y)=>F.s==="n"?y.at-x.at:pr(y)-pr(x));$("#list").innerHTML=a.map(card).join("")||"<p class='mut'>—</p>"}
function trk(){const q=$("#tk").value.trim().toUpperCase(),c=S.d.find(x=>x.id.toUpperCase()===q);$("#tr").innerHTML=c?card(c):`<p class="mut">${t("nf")}</p>`}
function hi(){$("#hi").textContent=`${t("hello")}, ${S.u.n||"👋"}`}
function dp(){const e=$("#dp");if(e)e.textContent="🏢 "+CATS[R.cat][4]+" · SLA "+CATS[R.cat][3]+"h"}
function go(v){V=v;render();scrollTo(0,0)}
function render(){const cs=S.d,n=cs.length||1;document.documentElement.lang=lg()?"te":"en";$("#lang").value=S.l;$("#nm").placeholder=t("uname");$("#rl").innerHTML=ROLES.map(r=>`<option value="${r[0]}"${S.u.r===r[0]?" selected":""}>${r[1+lg()]}</option>`).join("");$("#nav").innerHTML=NAV.map(k=>`<button class="${V===k[0]?"on":""}" onclick="go('${k[0]}')">${k[1+lg()]}</button>`).join("");$("#kpi").innerHTML=[[cs.length,t("total")],[Math.round(cs.filter(c=>c.st==="done").length/n*100)+"%",t("resr")],[cs.filter(over).length,t("over")],[new Set(cs.map(c=>c.city)).size,t("cities")]].map(a=>`<div class="kp"><b>${a[0]}</b><span>${a[1]}</span></div>`).join("");hi();$("#kpi").style.display=V==="feed"?"":"none";$("#hi").style.display=V==="home"?"none":"";$("#main").innerHTML=VIEWS[V]();if(V==="feed")list();if(V==="report")dp()}
function pick(k){R.cat=k;document.querySelectorAll(".tile").forEach(b=>b.classList.toggle("on",b.dataset.k===k));dp()}
function sug(){const s=$("#ti").value+" "+$("#de").value;for(const k of ORD)if(CATS[k][5].test(s)){pick(k);break}}
function vote(id){if(S.u.vt.includes(id))return toast(t("voted"),1);S.d.find(x=>x.id===id).v++;S.u.vt.push(id);S.u.p++;save();list();hi()}
function gps(){if(!navigator.geolocation)return toast(t("nogps"),1);navigator.geolocation.getCurrentPosition(p=>{let b="VJA",m=1e9;for(const k in CITIES){const d=(CITIES[k][2]-p.coords.latitude)**2+(CITIES[k][3]-p.coords.longitude)**2;if(d<m){m=d;b=k}}$("#ci").value=b;LOC=b;if(V!=="report")render();$("#ar").value=`GPS ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`},()=>toast(t("nogps"),1))}
async function ph(e){const f=e.target.files[0];if(!f)return;const b=await okImg(f);if(b){e.target.value="";return toast(t(b),1)}try{R.img=await shrink(f);$("#pv").innerHTML=`<img src="${R.img}" alt="">`}catch(x){toast(t("bad"),1)}}
function submit(){const g=i=>$("#"+i).value.trim(),ti=g("ti"),de=g("de"),ar=g("ar"),ci=g("ci");if(ti.length<3||de.length<8||!ar)return toast(t("need"),1);if(sens(ti+" "+de+" "+ar+" "+S.u.n))return toast(t("sens"),1);const key=(ti+de+ci).toLowerCase(),h=recent[key];if(h&&Date.now()-h.t<6e4)return toast(t("dup")+" "+h.id,1);const id=`AP-${ci}-2026-${[...crypto.getRandomValues(new Uint8Array(3))].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}`;S.d.unshift({id,t:ti,c:R.cat,city:ci,a:ar,sev:g("sv"),st:"pend",v:1,at:Date.now(),by:S.u.n||"Anonymous",d:de,img:R.img,w:"",pf:""});S.u.p+=10;S.u.c=ci;S.u.vt.push(id);recent[key]={id,t:Date.now()};R.img="";save();toast("✅ "+id);F.city="";go("feed")}
function asg(id,w){if(!w)return;const c=S.d.find(x=>x.id===id);c.w=w;c.st="prog";save();render()}
async function fixit(id){const f=document.getElementById("p"+id).files[0];if(!f)return toast(t("needp"),1);const b=await okImg(f);if(b)return toast(t(b),1);const c=S.d.find(x=>x.id===id);try{c.pf=await shrink(f)}catch(e){return toast(t("bad"),1)}c.st="done";save();toast("✅ "+id);render()}
function sos(on){$("#ov").classList.toggle("show",!!on);$("#ovc").innerHTML=`<h2>🆘 ${t("sosT")}</h2>${[["112","Emergency"],["100","Police"],["101","Fire"],["108","Ambulance"],["1070","AP disaster helpline"]].map(a=>`<p><a href="tel:${a[0]}">${a[0]}</a> <span class="mut">${a[1]}</span></p>`).join("")}<button class="b1" onclick="sos(0)">${t("close")}</button>`}
const showOv=h=>{$("#ovc").innerHTML=h+`<button class="b1" style="margin-top:10px" onclick="sos(0)">${t("close")}</button>`;$("#ov").classList.add("show")};

cd=x=>{const d=x.d,h=x.h;return `<div class="wc l${h?h.lv:0}"><div class="wh"><b>${cn(x.k)}</b><span class="tag">${x.n} ${lg()?"సమస్యలు":"open issues"}</span></div>${h?(h.tg.length?h.tg.map(t2=>`<span class="wt l${t2[0]}">${t2[1]}</span>`).join(""):`<span class="wt">✅ ${lg()?"పెద్ద ప్రమాదం లేదు":"No major hazard"}</span>`):""}${d?`<div class="wd">${d.time.map((t2,i)=>`<span><small>${new Date(t2).toLocaleDateString(lg()?"te-IN":"en-IN",{weekday:"short"})}</small><b>${Math.round(d.precipitation_sum[i]||0)}<u> mm</u></b></span>`).join("")}</div><small class="mut">💨 ${Math.round(h.g)} km/h · 🌡️ ${Math.round(h.tp)}°C</small>`:""}</div>`};
return `<div class="card"><h2>🌧️ ${t("fs")}</h2><p class="mut">${lg()?"రాబోయే వాతావరణ ప్రమాదాలు, నగరాల వారీగా పక్కపక్కనే.":"Upcoming weather hazards, city by city side by side."}</p><div class="wst"><span class="mut">${st}</span><button class="b2" onclick="wxr()">↻ ${lg()?"రిఫ్రెష్":"Refresh"}</button></div></div><div class="cgrid">${rows.map(cd).join("")}</div><div class="card"><div class="tipr">${TIPS.map(x=>`<div>${x[lg()]}</div>`).join("")}</div><p class="mut" style="margin-top:10px">${lg()?"ఇది మోడల్ అంచనా మాత్రమే, అధికారిక హెచ్చరిక కాదు. అధికారిక సమాచారం కోసం":"This is a model forecast, not an official warning. For official alerts see"} <a href="https://mausam.imd.gov.in" target="_blank" rel="noopener">IMD</a>.</p></div>`};

/* ---- header slides aside on scroll; menu button brings it back ---- */
(()=>{const h=document.querySelector("header");const b=document.createElement("button");b.id="hmb";b.textContent="☰";b.setAttribute("aria-label","Menu");b.style.cssText="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:11;width:44px;height:44px;border-radius:50%;border:0;background:#0e2a47;color:#fff;font-size:20px;box-shadow:0 6px 14px -4px #0008;opacity:0;pointer-events:none;transition:opacity .3s";document.body.appendChild(b);
let last=scrollY,away=false;const pad=()=>{if(!away)document.body.style.paddingTop=h.offsetHeight+"px"};
const set=a=>{away=a;h.classList.toggle("away",a);b.style.opacity=a?"1":"0";b.style.pointerEvents=a?"auto":"none";pad()};
b.onclick=()=>set(false);
addEventListener("scroll",()=>{const y=scrollY;if(y>last+8&&y>140)set(true);else if(y<last-8)set(false);last=y},{passive:true});
pad();new ResizeObserver(pad).observe(h);})();
render();
</script></body></html>
